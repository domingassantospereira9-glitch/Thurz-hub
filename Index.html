<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THURZ HUB</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 360px;
    background: #151515;
    border: 2px solid #dc1930;
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 0 20px #650010;
}

h1 {
    background: #bd1429;
    padding: 18px;
    border-radius: 10px;
    margin-top: 0;
}

.subtitle {
    color: #ff5366;
    font-weight: bold;
    margin-bottom: 25px;
}

button {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 12px 0;
    background: #292929;
    color: white;
    border: 1px solid #dc1930;
    border-radius: 9px;
    font-size: 16px;
    font-weight: bold;
}

button:active {
    background: #bd1429;
}

#mensagem {
    color: #ff6475;
    margin-top: 20px;
    min-height: 20px;
}

.footer {
    color: #888;
    font-size: 12px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

    <h1>☠ THURZ HUB</h1>

    <div class="subtitle">
        🏴‍☠️ ONE PIECE EDITION
    </div>

    <button onclick="avisar('Instant Steal: demonstração!')">
        🥚 Instant Steal
    </button>

    <button onclick="avisar('Teleguiado: demonstração!')">
        🧭 Teleguiado
    </button>

    <button onclick="avisar('THURZ HUB - One Piece Edition')">
        🏴‍☠️ Sobre o Hub
    </button>

    <button onclick="fechar()">
        ❌ Fechar Hub
    </button>

    <p id="mensagem"></p>

    <div class="footer">
        THURZ HUB • Projeto demonstrativo
    </div>

</div>

<script>
function avisar(texto) {
    document.getElementById("mensagem").textContent = texto;
}

function fechar() {
    document.querySelector(".container").style.display = "none";
}
</script>

</body>
</html>
